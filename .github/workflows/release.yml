name: Release

# Builds the APK and publishes a GitHub release with it attached. Two ways to start it:
#   - commit a new version tag (e.g. v0.3.1) into the RELEASE file and push, or
#   - push a git tag like v0.3.1 yourself.
# A release that already exists is left alone, so re-pushing is harmless.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["RELEASE"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out which release this is
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="$(tr -d '[:space:]' < RELEASE)"; fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "RELEASE must hold a version tag like v0.3.1, but holds '$TAG'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          gradle-version: 8.14.3

      # Optional: sign with a stable release key (repo secrets). Without it the APK is debug-signed.
      - name: Prepare signing key
        id: signing
        if: steps.tag.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        if: steps.tag.outputs.skip != 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          # The version code comes from the version (0.5.1 -> 501) so it always goes up with the version, and a newer
          # release can be installed over an older one. (The run number made v0.5.0 code 3, below the 0.4.x test builds.)
          CODE=$(echo "$VERSION" | awk -F'[.-]' '{print $1*10000 + $2*100 + $3}')
          gradle -p android :core:test :app:assembleRelease \
            -PversionName="$VERSION" -PversionCode="$CODE" --no-daemon

      - name: Publish release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          APK="coach-chicken-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          {
            echo "A plank timer that watches you plank, clucks at you, and draws you as a gold skeleton."
            echo
            echo "## Install"
            echo "1. On an Android phone (8.0 or newer, 64-bit ARM), download **$APK** below."
            echo "2. Open it and allow installing from your browser/file manager when asked."
            echo "3. Open **Coach Chicken**, tap **Start session**, allow the camera, prop the phone side-on, and plank."
            echo
            echo "Pose detection runs entirely on the phone and the app does not send the camera feed anywhere. The APK is about 30 MB because it bundles the pose-detection model."
            if [ "$SIGNED" != "release" ]; then
              echo
              echo "> **Note:** this build is signed with a debug key. If a later release was built by a different machine, Android may refuse to update over it; uninstall first in that case."
            fi
          } > notes.md
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Coach Chicken $TAG" --notes-file notes.md
