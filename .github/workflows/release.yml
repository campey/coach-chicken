name: Release

# Push a tag like v0.3.0 and this builds the APK and publishes a GitHub release with it attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # Optional: sign with a stable release key (repo secrets). Without it the APK is debug-signed.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle -p android :core:test :app:assembleRelease \
            -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER" --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          APK="coach-chicken-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          {
            echo "A plank timer that watches you plank, clucks at you, and draws you as a gold skeleton."
            echo
            echo "## Install"
            echo "1. On an Android phone (8.0 or newer, 64-bit ARM), download **$APK** below."
            echo "2. Open it and allow installing from your browser/file manager when asked."
            echo "3. Open **Coach Chicken**, tap **Start session**, allow the camera, prop the phone side-on, and plank."
            echo
            echo "Pose detection runs entirely on the phone and the app does not send the camera feed anywhere. The APK is about 30 MB because it bundles the pose-detection model."
            if [ "$SIGNED" != "release" ]; then
              echo
              echo "> **Note:** this build is signed with a debug key. If a later release was built by a different machine, Android may refuse to update over it; uninstall first in that case."
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" --title "Coach Chicken $GITHUB_REF_NAME" --notes-file notes.md
